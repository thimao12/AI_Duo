# Only used by compose.sonar.yml; the existing SonarCloud project keeps its own configuration.
sonar.projectKey=ai-duo-local
sonar.projectName=AI Duo (local)
sonar.sourceEncoding=UTF-8
sonar.sources=server/src,web/src,cli/src,shared,desktop,scripts
sonar.tests=server/src,cli/src,desktop
sonar.test.inclusions=**/*-smoke.ts,**/smoke.ts,**/*-smoke.mjs
sonar.exclusions=**/node_modules/**,**/dist/**,**/release/**,**/build/**
sonar.javascript.node.maxspace=2048
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.coverage.exclusions=**/*
