<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Duo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='%23d97757'/><circle cx='20' cy='16' r='9' fill='%2310a37f' fill-opacity='.85'/></svg>" />
    <script>
      // Apply a saved light/dark choice before first paint so the window never flashes.
      try {
        var t = localStorage.getItem('ai-duo:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      THESIS: A calm operator's desk for two agents. One quiet column shows progress at a glance and opens
      detail on demand. It refuses the dashboard-of-cards and the side-by-side "versus" layout.
      OWN-WORLD: The Codex-desktop grammar, as the user requested. Neutral greys, a slightly darker
      sidebar, hairline borders, a rounded composer with chip controls, round primary send, system UI
      type, mono only for code and data. Colour is reserved for state and for the two agents
      (Claude #d97757, Codex #10a37f), always paired with their names. Light and dark.
      STORY: The user sees which step is running, who is working and what the verdict was. They open
      reasoning, tool output or the diff only when they want to, then start the next task from the
      same composer.
      FIRST VIEWPORT: Project-grouped thread sidebar on the left (about 264px). Centred heading plus a
      large composer as the only primary action. In a thread: top bar with title, status and Stop;
      a single conversation column (max 760px); composer docked at the bottom; changes panel on the right.
      FORM: Canon, pinned by the user ("giống Codex app desktop"); seed key: user-pinned, no roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <style>
      #startup-state {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #startup-state[hidden] { display: none; }
      #startup-state > section { width: min(100%, 520px); }
      #startup-state h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
      #startup-state p { margin: 0; opacity: .72; }
      #startup-state pre { margin: 16px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; opacity: .72; }
      #startup-reload {
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        background: CanvasText;
        color: Canvas;
        font: inherit;
        cursor: pointer;
      }
      #startup-reload[hidden] { display: none; }
    </style>
    <div id="startup-state" role="status" aria-live="polite">
      <section>
        <h1 id="startup-title">Đang mở AI Duo</h1>
        <p id="startup-message">Đang khởi chạy giao diện…</p>
        <pre id="startup-detail" hidden></pre>
        <button id="startup-reload" type="button" hidden>Tải lại</button>
      </section>
    </div>
    <script>
      (() => {
        const state = document.getElementById('startup-state');
        const title = document.getElementById('startup-title');
        const message = document.getElementById('startup-message');
        const detail = document.getElementById('startup-detail');
        const reload = document.getElementById('startup-reload');
        let ready = false;

        window.aiDuoStartupReady = () => {
          ready = true;
          state.hidden = true;
        };
        const fail = (reason) => {
          if (ready) return;
          title.textContent = 'Không thể mở giao diện AI Duo';
          message.textContent = 'Hãy tải lại ứng dụng. Nếu lỗi vẫn còn, gửi dòng lỗi bên dưới để kiểm tra.';
          if (reason) {
            detail.textContent = String(reason).slice(0, 800);
            detail.hidden = false;
          }
          reload.hidden = false;
          state.setAttribute('role', 'alert');
        };

        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target && target !== window) fail(`Không tải được tài nguyên: ${target.src || target.href || target.tagName}`);
          else fail(event.error?.stack || event.message || 'Lỗi JavaScript khi khởi chạy.');
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          fail(event.reason?.stack || event.reason || 'Lỗi khởi chạy không xác định.');
        });
        reload.addEventListener('click', () => window.location.reload());
        window.setTimeout(() => fail('Giao diện không phản hồi sau 12 giây.'), 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
